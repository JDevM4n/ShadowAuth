service:
  name: banco-andino-auth
  environment: production
  version: 2.4.1

authentication:
  provider: ldap
  ldap_server: ldap01.banco-andino.local
  session_timeout: 15m

database:
  host: auth-db01.banco-andino.local
  port: 5432

backup:
  server: backup01.banco-andino.local
  schedule: daily-02:30

audit:
  enabled: true
  destination: monitoring01.banco-andino.local
