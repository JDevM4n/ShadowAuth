

services:

  postgres:

    image: postgres:16

    container_name: shadowauth-postgres

    restart: unless-stopped

    environment:

      POSTGRES_DB: shadowauth

      POSTGRES_USER: shadowauth

      POSTGRES_PASSWORD: shadowauth

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:

  postgres_data: